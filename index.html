<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saga Orb Chat • Multi-user Demo</title>
  <script src="https://js.pusher.com/8.2/pusher.min.js"></script>
  <style>
    :root {
      --primary: #0095f6;
      --dark: #121212;
      --darker: #0a0a0a;
      --gray: #8e8e8e;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--dark);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1a1a1a;
      padding: 12px;
      border-bottom: 1px solid #333;
      text-align: center;
      font-weight: 600;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.4;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .message.sent {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.received {
      align-self: flex-start;
      background: #262626;
      border-bottom-left-radius: 4px;
    }
    .message .sender {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-bottom: 4px;
      display: block;
    }
    .input-area {
      padding: 12px 16px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 10px;
    }
    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 22px;
      background: #262626;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    #messageInput::placeholder { color: #888; }
    #sendBtn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 22px;
      padding: 0 20px;
      font-weight: 600;
      cursor: pointer;
    }
    #sendBtn:hover { opacity: 0.9; }
    #status {
      text-align: center;
      padding: 8px;
      font-size: 0.8rem;
      color: #777;
    }
    .system {
      align-self: center;
      background: #1e1e1e;
      color: #aaa;
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 12px;
      margin: 8px 0;
    }
  </style>
</head>
<body>

  <div class="header">Saga Orb Chat (Multi-user Demo)</div>
  <div id="status">Connecting...</div>
  <div class="chat-container" id="chat"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    let username = localStorage.getItem('sagaOrbUsername') ||
                   prompt("Your display name:", "Guest") ||
                   "Guest";
    localStorage.setItem('sagaOrbUsername', username);

    // ── Pusher public sandbox configuration (works without account for testing) ──
    const pusher = new Pusher('e60c2b1a7b2d3f4e5c6d', {  // ← public demo key
      cluster: 'eu',
      forceTLS: true
    });

    const channel = pusher.subscribe('saga-orb-public-chat');

    pusher.connection.bind('state_change', (states) => {
      status.textContent = states.current;
      if (states.current === 'connected') {
        status.style.color = '#4caf50';
        addSystemMessage(`Welcome ${username}! Connected to public chat`);
        channel.trigger('client-join', { username });
      } else if (states.current === 'disconnected' || states.current === 'failed') {
        status.style.color = '#f44336';
      }
    });

    // Receive regular messages
    channel.bind('client-new-message', (data) => {
      const isSent = data.username === username;
      addMessage(data.text, isSent ? 'sent' : 'received', data.username);
    });

    // Receive join notifications
    channel.bind('client-join', (data) => {
      addSystemMessage(`${data.username} joined the chat`);
    });

    function addMessage(text, type, sender) {
      const div = document.createElement('div');
      div.classList.add('message', type);
      if (type === 'received') {
        const span = document.createElement('span');
        span.classList.add('sender');
        span.textContent = sender;
        div.appendChild(span);
      }
      div.appendChild(document.createTextNode(text));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.classList.add('system');
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      channel.trigger('client-new-message', {
        username: username,
        text: text
      });

      input.value = '';
      input.focus();
    }

    sendBtn.onclick = sendMessage;
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    input.focus();
  </script>
</body>
</html>
