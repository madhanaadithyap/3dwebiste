<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saga Orb - Mini Chat (PubNub Demo)</title>
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.8.2.6.min.js"></script>
  <style>
    :root { --primary: #0095f6; --dark: #121212; --darker: #0a0a0a; --gray: #8e8e8e; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--dark); color:white; height:100vh; display:flex; flex-direction:column; }
    .header { background:#1a1a1a; padding:12px; border-bottom:1px solid #333; text-align:center; font-weight:600; }
    .chat-container { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
    .message { max-width:75%; padding:10px 14px; border-radius:18px; line-height:1.4; font-size:0.95rem; word-wrap:break-word; }
    .message.sent { align-self:flex-end; background:var(--primary); color:white; border-bottom-right-radius:4px; }
    .message.received { align-self:flex-start; background:#262626; border-bottom-left-radius:4px; }
    .message .sender { font-size:0.75rem; opacity:0.7; margin-bottom:4px; display:block; }
    .input-area { padding:12px 16px; background:#1a1a1a; border-top:1px solid #333; display:flex; gap:10px; }
    #messageInput { flex:1; padding:12px 16px; border:none; border-radius:22px; background:#262626; color:white; font-size:1rem; outline:none; }
    #messageInput::placeholder { color:#888; }
    #sendBtn { background:var(--primary); color:white; border:none; border-radius:22px; padding:0 20px; font-weight:600; cursor:pointer; }
    #sendBtn:hover { opacity:0.9; }
    #status { text-align:center; padding:8px; font-size:0.8rem; color:#777; }
    .system { align-self:center; background:#1e1e1e; color:#aaa; font-size:0.85rem; padding:8px 14px; border-radius:12px; margin:8px 0; }
  </style>
</head>
<body>

  <div class="header">Saga Orb Chat (Multi-User Demo)</div>
  <div id="status">Connecting...</div>
  <div class="chat-container" id="chat"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    let username = localStorage.getItem('chatUsername') || prompt("Your name:", "Guest") || "Guest";
    localStorage.setItem('chatUsername', username);

    // PubNub public demo keys (no signup needed for testing)
    const pubnub = new PubNub({
      publishKey: 'demo',
      subscribeKey: 'demo',
      userId: username
    });

    const channelName = 'saga-orb-chat';

    pubnub.addListener({
      status: (s) => {
        if (s.category === 'PNConnectedCategory') {
          status.textContent = 'Connected!';
          status.style.color = '#4caf50';
          addSystemMessage(`Welcome, ${username}!`);
          pubnub.publish({ channel: channelName, message: { type: 'join', user: username } });
        } else if (s.category === 'PNDisconnectedCategory' || s.category === 'PNReconnectedCategory') {
          status.textContent = 'Reconnecting...';
        }
      },
      message: (m) => {
        const msg = m.message;
        if (msg.type === 'join') {
          addSystemMessage(`${msg.user} joined the chat`);
        } else if (msg.type === 'message') {
          const isSent = msg.user === username;
          addMessage(msg.text, isSent ? 'sent' : 'received', msg.user);
        }
      }
    });

    pubnub.subscribe({ channels: [channelName] });

    function addMessage(text, type, sender) {
      const div = document.createElement('div');
      div.classList.add('message', type);
      if (type === 'received') {
        const span = document.createElement('span');
        span.classList.add('sender');
        span.textContent = sender;
        div.appendChild(span);
      }
      div.appendChild(document.createTextNode(text));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.classList.add('system');
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      pubnub.publish({
        channel: channelName,
        message: { type: 'message', user: username, text }
      });
      input.value = '';
      input.focus();
    }

    sendBtn.onclick = sendMessage;
    input.addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    input.focus();
  </script>
</body>
</html>
