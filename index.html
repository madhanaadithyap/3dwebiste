<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pokémon Red - Tiny Version</title>
<style>
  body {
    margin:0;
    height:100vh;
    background:#000;
    font-family: Arial, Helvetica, sans-serif;
    image-rendering: pixelated;
    overflow:hidden;
  }
  #screen {
    width: 240px;
    height: 160px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    image-rendering: pixelated;
    border: 8px solid #444;
    box-shadow: 0 0 30px #000;
    background: #000;
    overflow: hidden;
  }
  #game {
    width: 100%;
    height: 100%;
    position: relative;
  }
  .tile {
    width: 16px;
    height: 16px;
    position: absolute;
    image-rendering: pixelated;
  }
  #player {
    width: 16px;
    height: 16px;
    background: red;
    border-radius: 3px;
    position: absolute;
    z-index: 10;
    transition: all 0.12s;
  }
  #battle {
    display: none;
    position: absolute;
    inset: 0;
    background: #112;
    color: white;
    font-size: 13px;
    padding: 8px;
    box-sizing: border-box;
  }
  #text-box {
    position: absolute;
    bottom: 8px;
    left: 8px;
    right: 8px;
    background: white;
    color: black;
    border: 3px solid #000;
    padding: 8px;
    font-size: 14px;
    min-height: 48px;
  }
  button {
    margin: 6px 12px 6px 0;
    padding: 6px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="screen">
  <div id="game"></div>
  <div id="player"></div>
  <div id="battle" class="hidden">
    <div style="position:absolute; top:8px; left:8px; right:8px;">
      <div>A wild <strong>POKéMON</strong> appeared!</div>
      <div id="enemy-info">Lv5 WILD RATTATA HP:◻◻◻◻◻</div>
    </div>
    <div id="text-box">
      What will <strong>PIKACHU</strong> do?
      <div style="margin-top:12px;">
        <button onclick="attack()">FIGHT</button>
        <button onclick="run()">RUN</button>
        <button onclick="bag()">BAG</button>
        <button onclick="pokemon()">POKéMON</button>
      </div>
    </div>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
const TILE = 16;
const MAP_W = 30;
const MAP_H = 28;

const mapData = [
  "..............................",
  "..............................",
  "....####################......",
  "....#..................#......",
  "....#..t.t.t...........#......",
  "....#..t...t.t.........#......",
  "....#....t.....t.......#......",
  "....#..t.t.t.t.........#......",
  "....#..................#......",
  "....#..t.........t.....#......",
  "....#......t.t.........#......",
  "....#..t.t.......t.....#......",
  "....#..................#......",
  "....####################......",
  "..............................",
  "....####################......",
  "....#..................#......",
  "....#..t.t.....t.......#......",
  "....#....t.t.t.........#......",
  "....#..t.......t.t.....#......",
  "....#..................#......",
  "....#..t.t.t...........#......",
  "....#......t.....t.....#......",
  "....####################......",
  "..............................",
  "..............................",
  "..............................",
  ".............................."
].map(row => row.split(''));

let player = { x: 15, y: 12, dir: 'down' };
let inBattle = false;
let stepsSinceLastCheck = 0;

// ────────────────────────────────────────────────
function initMap() {
  const game = document.getElementById('game');
  game.innerHTML = '';

  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.left = (x * TILE) + 'px';
      tile.style.top  = (y * TILE) + 'px';

      const c = mapData[y][x];
      if (c === '#') {
        tile.style.background = '#6b8c42'; // grass border dark
      } else if (c === 't') {
        tile.style.background = '#8bac54'; // tall grass
      } else {
        tile.style.background = '#c0e4a8'; // normal grass
      }

      game.appendChild(tile);
    }
  }
}

function updatePlayer() {
  const p = document.getElementById('player');
  p.style.left = (player.x * TILE) + 'px';
  p.style.top  = (player.y * TILE) + 'px';
}

function tryMove(dx, dy) {
  const nx = player.x + dx;
  const ny = player.y + dy;

  if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) return;
  if (mapData[ny][nx] === '#') return;

  player.x = nx;
  player.y = ny;
  updatePlayer();

  stepsSinceLastCheck++;
  if (mapData[ny][nx] === 't' && stepsSinceLastCheck > 4) {
    if (Math.random() < 0.25) {
      startBattle();
    }
    stepsSinceLastCheck = 0;
  }
}

function startBattle() {
  inBattle = true;
  document.getElementById('battle').classList.remove('hidden');
  document.getElementById('text-box').innerHTML = `
    A wild <strong>RATTATA</strong> appeared!<br><br>
    <strong>PIKACHU</strong> Lv5<br>
    <strong>HP</strong> 18/18<br><br>
    What will <strong>PIKACHU</strong> do?
    <div style="margin-top:12px;">
      <button onclick="attack()">FIGHT</button>
      <button onclick="run()">RUN</button>
      <button onclick="bag()">BAG</button>
      <button onclick="pokemon()">POKéMON</button>
    </div>
  `;
}

function attack() {
  document.getElementById('text-box').innerHTML = `
    PIKACHU used <strong>THUNDERSHOCK</strong>!<br><br>
    It's super effective!<br>
    Wild RATTATA fainted!
    <div style="margin-top:20px;">
      <button onclick="endBattle()">OK</button>
    </div>
  `;
}

function run() {
  if (Math.random() < 0.7) {
    document.getElementById('text-box').innerHTML = `
      Got away safely!<br><br>
      <button onclick="endBattle()">OK</button>
    `;
  } else {
    document.getElementById('text-box').innerHTML = `
      Can't escape!<br><br>
      Wild RATTATA used <strong>BITE</strong>!<br>
      <button onclick="endBattle(true)">OK</button>
    `;
  }
}

function bag() { document.getElementById('text-box').innerHTML = "No items..."; }
function pokemon() { document.getElementById('text-box').innerHTML = "Only PIKACHU in party."; }

function endBattle(lose = false) {
  inBattle = false;
  document.getElementById('battle').classList.add('hidden');
  if (lose) {
    alert("PIKACHU fainted!\n\n... but this is a demo so nothing happens.");
  }
}

// ────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (inBattle) return;

  switch(e.key.toLowerCase()) {
    case 'arrowup': case 'w':    tryMove(0, -1); break;
    case 'arrowdown': case 's':  tryMove(0, 1); break;
    case 'arrowleft': case 'a':  tryMove(-1, 0); break;
    case 'arrowright': case 'd': tryMove(1, 0); break;
  }
});

initMap();
updatePlayer();

</script>
</body>
</html>
