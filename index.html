<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Madhan Aadithya P</title>
  <style>
    *{
      color: white;
    }
    body { margin: 0; overflow: hidden; }
    #joystick-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 120px;
      height: 120px;
      z-index: 10;
    }
    #health-bar-container {
      
      
      width: 200px;
      height: 20px;
      background: #444;
      border: 2px solid #000;
      z-index: 20;
    }
    #health-bar {
      width: 100%;
      height: 100%;
      background: limegreen;
    }
    .bar{
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 10px;
    }
    .bar p{
      text-align: center;
      font-family: sans-serif;
      font-weight: 900;
    }
    #wave{
      position: fixed;
      width: 100vw;
      display: flex;
      align-items: center;
      text-align: center;
      justify-content: center;
      padding: 7.5px;
      text-transform: uppercase;
      font-family: sans-serif;
    }
#wave{
  font-weight: 900;
  background-color: red;
  color: black;
}
#popup{
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: rgba(0, 0, 0, 0.85);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 1000;
  font-family: sans-serif;
  font-size: 5vw;
}
@media (min-width: 600px) {
  #popup {
    font-size: 2vw;
  }
}
#score{
  position: fixed;
  top:50%;
  right:50%;
  transform: translate(-50%,-50%);
}
  </style>
</head>
<body>
  <div class="barr"><p> <span id="score">0</span></p></div>

  <div id="wave" class="wave"><p>Wave 1</p></div>
  <div class="bar"><p>Health</p>
  <div id="health-bar-container"><div id="health-bar"></div></div></div>
  <div id="joystick-container"></div>
<div id="popup" >
  <h1>How to Play</h1>
  <p>WASD or joystick to move</p>
  <p>Click to shoot</p>
  <p>Survive enemy waves!</p>
  <button  onclick="startGame()" style="padding: 10px 20px; font-size: 16px; margin-top: 20px;color:black;">Start Game</button>
</div>
<div id="loader" style="
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  background: black;
  color: white;
  font-size: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;">
  Loading...
</div>


  <script src="https://cdn.jsdelivr.net/npm/three@0.138.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.138.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.138.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.138.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.138.0/examples/js/postprocessing/UnrealBloomPass.js"></script>


  <script>
    let gamePaused = true;
let score = 0;
function updateScore() {
  document.getElementById('score').innerText = score;
}
setInterval(() => {
  if (!gamePaused) {
    setCookie("gameHealth", health);
    setCookie("gameScore", score);
  }
}, 2000);

    let scene, camera, renderer, fox, joystick;
    const keys = {};
    let moveForward = false, moveBackward = false, rotateLeft = false, rotateRight = false;

    const mixers = [];
    const enemies = [];
let wave = 1;
let enemyCount = 20;
let waveInProgress = false;


function spawnWave() {
  for (let i = 0; i < enemyCount; i++) {
    const geometry = new THREE.BoxGeometry(2, 2, 2);
    const material = new THREE.MeshStandardMaterial({ color: 0xff0000,emissive:0xff0000,emissiveIntensity:100,metalness:0.2,roughness:0.5 });
    const enemy = new THREE.Mesh(geometry, material);
const radius = Math.random() * 30 + 20; // 20 to 50 units away
const angle = Math.random() * Math.PI * 2;
const x = fox.position.x + Math.cos(angle) * radius;
const z = fox.position.z + Math.sin(angle) * radius;

    enemy.position.set(x,0, z);
    enemy.castShadow = true;
    scene.add(enemy);
    enemies.push(enemy);
  }
  console.log(`cl ${wave-1} started with ${enemyCount} enemies.`);
  document.getElementById('wave').innerHTML=`Wave ${wave-1} started with ${enemyCount} enemies.`;
}

    const bullets = [];
    
    let health = 100;

    init();
    animate();
function setCookie(name, value, days = 30) {
  const d = new Date();
  d.setTime(d.getTime() + (days*24*60*60*1000));
  document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
}

function getCookie(name) {
  const cookies = document.cookie.split("; ");
  for (let cookie of cookies) {
    const [key, value] = cookie.split("=");
    if (key === name) return value;
  }
  return null;
}

    function init() {
    const savedHealth = getCookie("gameHealth");
const savedScore = getCookie("gameScore");

if (savedHealth !== null) health = parseFloat(savedHealth);
if (savedScore !== null) {
  score = parseInt(savedScore);
  updateScore(); // update the score bar visually
}


      scene = new THREE.Scene();




      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, -10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 20, 10);
      light.castShadow = true;
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.4));
// Add moonlight with directional shadows
const moonlight = new THREE.DirectionalLight(0x000000, 1.0); // Cool bluish tone for moonlight
moonlight.position.set(50, 100, -50);
moonlight.castShadow = true;

moonlight.shadow.mapSize.width = 2048;
moonlight.shadow.mapSize.height = 2048;
moonlight.shadow.camera.near = 1;
moonlight.shadow.camera.far = 500;
moonlight.shadow.camera.left = -200;
moonlight.shadow.camera.right = 200;
moonlight.shadow.camera.top = 200;
moonlight.shadow.camera.bottom = -200;

scene.add(moonlight);
scene.add(new THREE.AmbientLight(0x000000, 1.5)); // Dim, cool ambient light

scene.background = new THREE.Color(0x000000); // black space
scene.fog = new THREE.Fog(0x050510, 10, 200);
      // Create starfield
const starGeometry = new THREE.BufferGeometry();
const starCount = 2000;
const starPositions = [];

for (let i = 0; i < starCount; i++) {
  starPositions.push(
    (Math.random() - 0.5) * 1000,
    (Math.random() - 0.5) * 1000,
    (Math.random() - 0.5) * 1000
  );
}

starGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const starMaterial = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 1.2,
  transparent: true,
  opacity: 0.8
});

const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);




      // Player
      const loader = new THREE.GLTFLoader();
      loader.load('Ghost.glb', gltf => {
        fox = gltf.scene;
        fox.scale.set(2, 2, 2);
        fox.position.set(0, 0, 0);
        scene.add(fox);
        document.getElementById('loader').style.display = 'none';
      });
      //shooting glow
  // Enemies
      function spawnEnemy() {
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const enemy = new THREE.Mesh(geometry, material);
        enemy.position.set(Math.random() * 200 - 100, 1, Math.random() * 200 - 100);
        enemy.castShadow = true;
        scene.add(enemy);
        enemies.push(enemy);
      }


      // Controls
      document.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'Space') shootBullet();
      });
      document.addEventListener('keyup', e => keys[e.code] = false);
      document.addEventListener('click', shootBullet); // tap to shoot on mobile

      joystick = nipplejs.create({
        zone: document.getElementById('joystick-container'),
        mode: 'static',
        position: { left: '60px', bottom: '60px' },
        color: 'white'
      });

      joystick.on('move', (evt, data) => {
        if (data.direction) {
          moveForward = data.direction.angle === 'up';
          moveBackward = data.direction.angle === 'down';
          rotateLeft = data.direction.angle === 'left';
          rotateRight = data.direction.angle === 'right';
        }
      });

      joystick.on('end', () => {
        moveForward = moveBackward = rotateLeft = rotateRight = false;
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
      function flashMuzzle(position) {
  const flash = new THREE.PointLight( 0x00ffff, 20, 10);
  flash.position.copy(position);
  scene.add(flash);
  setTimeout(() => scene.remove(flash), 100);
}


    
    function shootBullet() {
      flashMuzzle(fox.position);

      if (!fox) return;
      const bulletGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8);
const bulletMaterial = new THREE.MeshStandardMaterial({
  color: 0x00ffff,
  emissive: 0x00ffff,
  emissiveIntensity: 1,
  metalness: 0.5,
  roughness: 0.2,
});
      
const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);

      bullet.position.copy(fox.position);
      const direction = new THREE.Vector3();
      fox.getWorldDirection(direction);
      direction.y = 0;
      bullet.userData.velocity = direction.normalize().clone().multiplyScalar(0.5);
      scene.add(bullet);
      bullets.push(bullet);
    }
function createBlastEffect(position) {
  const particles = [];
  const particleCount = 20;

  for (let i = 0; i < particleCount; i++) {
    const geometry = new THREE.SphereGeometry(0.1, 4, 4);
    const material = new THREE.MeshStandardMaterial({ color: 0xff6600 });
    const particle = new THREE.Mesh(geometry, material);
    particle.position.copy(position);
    const velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 0.5,
      Math.random() * 0.5,
      (Math.random() - 0.5) * 0.5
    );
    particle.userData.velocity = velocity;
    scene.add(particle);
    particles.push(particle);
  }

  let life = 30; // frames

  function updateParticles() {
    if (life-- <= 0) {
      particles.forEach(p => scene.remove(p));
      return;
    }
    particles.forEach(p => {
      p.position.add(p.userData.velocity);
      p.userData.velocity.multiplyScalar(0.95); // slow down
    });
    requestAnimationFrame(updateParticles);
  }

  updateParticles();
}

    function updateHealthBar() {
      const bar = document.getElementById("health-bar");
      bar.style.width = `${Math.max(0, health)}%`;
      if (health <= 0) {
        alert("Game Over!");
        location.reload();
      }
    }

    function animate() {
      
      if (!gamePaused) requestAnimationFrame(animate);


      if (fox) {
        const direction = new THREE.Vector3();
        const forward = new THREE.Vector3();
        fox.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        direction.set(0, 0, 0);
        if (keys['KeyW'] || moveForward) direction.add(forward);
        if (keys['KeyS'] || moveBackward) direction.sub(forward);
        if (keys['KeyA'] || rotateLeft) fox.rotation.y += 0.015;
        if (keys['KeyD'] || rotateRight) fox.rotation.y -= 0.015;

        fox.position.add(direction.multiplyScalar(0.09));

        // Camera
        const camOffset = new THREE.Vector3(0, 2.5, -10).applyQuaternion(fox.quaternion);
        camera.position.copy(fox.position.clone().add(camOffset));
        camera.lookAt(fox.position);

        // Enemies follow
        enemies.forEach(enemy => {
          const dir = fox.position.clone().sub(enemy.position);
          if (dir.length() < 1.5) {
            health -= 0.5;
            updateHealthBar();
          } else {
            dir.normalize();
            enemy.position.add(dir.multiplyScalar(0.025));
          }
        });



        // Update bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.position.add(b.userData.velocity);

          if (b.position.distanceTo(fox.position) > 100) {

            scene.remove(b);
            bullets.splice(i, 1);
            continue;
          }

          // Check hit
          for (let j = enemies.length - 1; j >= 0; j--) {
            if (b.position.distanceTo(enemies[j].position) < 1) {
              score += 10;
updateScore();
 createBlastEffect(enemies[j].position);
              scene.remove(enemies[j]);
              enemies.splice(j, 1);
              scene.remove(b);
              bullets.splice(i, 1);
              break;
            }
          }
          // Start next wave when all enemies are gone
if (enemies.length === 0 && !waveInProgress) {
  waveInProgress = true;
  wave++;
  enemyCount += 2;
  setTimeout(() => {
    spawnWave();
    waveInProgress = false;
  }, 2); // 2-second delay
}


        }
      }

      renderer.render(scene, camera);
    }
function startGame() {
  document.getElementById("popup").style.display = "none";
  gamePaused = false;
  animate(); // resume animation
}

</script>
</body>
</html>
