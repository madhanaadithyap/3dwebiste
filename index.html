<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saga Orb Chat</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#000; color:white; height:100vh; display:flex; flex-direction:column; }
    #chat { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:80%; padding:9px 14px; border-radius:18px; line-height:1.4; font-size:15px; word-wrap:break-word; }
    .sent { align-self:flex-end; background:#0095f6; border-bottom-right-radius:4px; }
    .received { align-self:flex-start; background:#262626; border-bottom-left-radius:4px; }
    .input-area { padding:10px; background:#111; display:flex; gap:8px; }
    #msgInput { flex:1; padding:12px 16px; background:#262626; color:white; border:none; border-radius:25px; font-size:15px; outline:none; }
    #sendBtn { background:#0095f6; color:white; border:none; padding:0 20px; border-radius:25px; font-weight:600; cursor:pointer; }
    .name { font-size:12px; opacity:0.7; margin-bottom:3px; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div class="input-area">
    <input type="text" id="msgInput" placeholder="Message" autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    
    // Free public server - works forever, no signup
    const ws = new WebSocket('wss://socketsbay.com/wss/v2/1/demo/');
    
    let myName = prompt("Enter your name:", "User") || "User";

    ws.onopen = () => {
      addMsg("Connected! Start chatting 👋", "received");
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.text) {
          addMsg(data.text, "received", data.name);
        }
      } catch(e) {
        // ignore non-json messages
      }
    };

    function addMsg(text, type, sender = myName) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      if (type === 'received') {
        const nameSpan = document.createElement('div');
        nameSpan.className = 'name';
        nameSpan.textContent = sender;
        div.appendChild(nameSpan);
      }
      div.appendChild(document.createTextNode(text));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function send() {
      const text = input.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;
      
      const payload = JSON.stringify({ name: myName, text: text });
      ws.send(payload);
      addMsg(text, "sent");
      input.value = '';
    }

    sendBtn.onclick = send;
    input.onkeydown = (e) => { if (e.key === 'Enter') send(); };
    input.focus();
  </script>
</body>
</html>
