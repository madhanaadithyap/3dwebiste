<!-- ================= POSTER INTRO ================= -->
<section class="poster">
  <div class="poster-overlay"></div>
  <div class="poster-content">
    <span class="tagline">A CINEMATIC MUSIC EXPERIENCE</span>
    <h1 class="poster-title">MADHAN AADITHYA</h1>
    <p class="poster-sub">Melophile • Composer • Producer</p>
    <p class="poster-cta">Scroll to enter</p>
  </div>
</section>

<style>
.poster {
  position: relative;
  height: 100vh;
  background: #000 url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  transition: opacity 1s ease;
  overflow: hidden;
}

.poster-overlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255,255,255,0.06), rgba(0,0,0,0.95));
  z-index: 2;
}

.poster-content {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  opacity: 0;
  animation: posterFade 2s ease forwards;
}

.tagline {
  font-size: 0.85rem;
  letter-spacing: 4px;
  opacity: 0;
  animation: slideUp 1.8s ease forwards;
  animation-delay: 0.5s;
}

.poster-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(4rem, 8vw, 6.8rem);
  letter-spacing: 6px;
  margin: 22px 0 14px;
  opacity: 0;
  animation: blurIn 2s ease forwards;
  animation-delay: 1s;
  animation-fill-mode: forwards;
}

.poster-sub {
  font-size: 1.1rem;
  letter-spacing: 2px;
  opacity: 0;
  animation: slideUp 2s ease forwards;
  animation-delay: 1.8s;
}

.poster-cta {
  margin-top: 60px;
  font-size: 0.85rem;
  letter-spacing: 3px;
  opacity: 0;
  animation: fadePulse 2.5s ease forwards;
  animation-delay: 2.5s;
}

@keyframes posterFade { to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 0.9; } }
@keyframes blurIn { from { filter: blur(20px); opacity: 0; transform: scale(1.05); } to { filter: none; opacity: 1; transform: scale(1); } }
@keyframes fadePulse { from { opacity: 0; } to { opacity: 0.8; } }
</style>

<script>
// Optional ambient sound
const sound = new Audio('https://cdn.pixabay.com/audio/2022/03/15/audio_4b2b7c8c5c.mp3');
sound.volume = 0.35;
let played = false;
['click','wheel','touchstart'].forEach(evt=>{
  window.addEventListener(evt,()=>{
    if(!played){ sound.play().catch(()=>{}); played=true; }
  },{once:true});
});

// Fade out poster & lock title on scroll
const poster = document.querySelector('.poster');
const title = document.querySelector('.poster-title');
window.addEventListener('scroll', ()=>{
  const y = window.scrollY;
  poster.style.opacity = Math.max(0,1-y/400); // fade poster
  if(y > 50){
    title.style.animationPlayState = 'paused'; // stop breathing
    title.style.letterSpacing = '6px';
  }
});
</script>
