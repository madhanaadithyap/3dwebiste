<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saga Orb - Glossy Chat</title>
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.8.2.6.min.js"></script>
  <style>
    :root {
      --bg: #0f0f17;
      --card: linear-gradient(135deg, rgba(30, 35, 60, 0.7), rgba(15, 20, 45, 0.5));
      --primary: #00aaff;
      --primary-glow: rgba(0, 170, 255, 0.35);
      --text: #f0f4ff;
      --text-muted: #a0b0d0;
      --accent: #ff6bcb;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 8px 32px rgba(0,0,0,0.45);
      --glass-shine: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.05) 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0,170,255,0.08) 0%, transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255,107,203,0.06) 0%, transparent 35%);
      overflow: hidden;
    }

    .header {
      background: rgba(15, 20, 45, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      font-weight: 600;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* Setup Screen */
    .setup-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 10;
      background: var(--bg);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .setup-screen.hidden {
      opacity: 0;
      transform: translateY(30px);
      pointer-events: none;
    }

    #usernameInput {
      padding: 16px 24px;
      width: 320px;
      max-width: 90%;
      border: none;
      border-radius: 999px;
      background: var(--card);
      backdrop-filter: blur(12px);
      color: white;
      font-size: 1.1rem;
      text-align: center;
      box-shadow: var(--shadow), inset 0 2px 8px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    #usernameInput:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--primary-glow), var(--shadow);
      transform: translateY(-2px);
    }

    #joinBtn {
      padding: 14px 40px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), #0088dd);
      color: white;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(0,170,255,0.4);
      transition: all 0.3s ease;
    }

    #joinBtn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 12px 32px rgba(0,170,255,0.5);
    }

    #errorMsg {
      color: #ff6b6b;
      font-size: 0.95rem;
      background: rgba(255,107,107,0.15);
      padding: 10px 20px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      display: none;
    }

    /* Chat Area */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
      opacity: 0;
      transition: opacity 0.8s ease 0.3s;
    }

    .main-chat.show {
      opacity: 1;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(100,140,255,0.3) transparent;
    }

    .chat-container::-webkit-scrollbar {
      width: 6px;
    }

    .chat-container::-webkit-scrollbar-thumb {
      background: rgba(100,140,255,0.3);
      border-radius: 10px;
    }

    .message {
      max-width: 78%;
      padding: 12px 18px;
      border-radius: 22px;
      line-height: 1.45;
      font-size: 1rem;
      position: relative;
      backdrop-filter: blur(10px);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow), inset 0 1px 3px rgba(255,255,255,0.04);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .message.sent {
      align-self: flex-end;
      background: linear-gradient(135deg, #00aaff, #0077cc);
      color: white;
      border: none;
      border-bottom-right-radius: 6px;
    }

    .message.received {
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }

    .message:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    .message .sender {
      font-size: 0.78rem;
      opacity: 0.75;
      margin-bottom: 5px;
      display: block;
      font-weight: 500;
    }

    .input-area {
      padding: 16px 20px;
      background: rgba(15, 20, 45, 0.6);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.4);
    }

    #messageInput {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 999px;
      background: rgba(40,50,80,0.6);
      backdrop-filter: blur(10px);
      color: white;
      font-size: 1.05rem;
      outline: none;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    #messageInput:focus {
      background: rgba(50,65,100,0.8);
      box-shadow: 0 0 0 3px var(--primary-glow), inset 0 2px 8px rgba(0,0,0,0.4);
    }

    #sendBtn {
      background: linear-gradient(90deg, var(--primary), #0088dd);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 0 28px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(0,170,255,0.35);
    }

    #sendBtn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(0,170,255,0.5);
    }

    #status {
      text-align: center;
      padding: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
      background: rgba(15,20,45,0.4);
      backdrop-filter: blur(8px);
    }

    .system {
      align-self: center;
      background: rgba(30,35,60,0.5);
      color: #c0d0ff;
      font-size: 0.9rem;
      padding: 10px 18px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      margin: 12px 0;
    }
  </style>
</head>
<body>

  <div class="header">Saga Orb</div>

  <div class="setup-screen" id="setup">
    <input type="text" id="usernameInput" placeholder="Choose your display name..." autocomplete="off" maxlength="20" />
    <button id="joinBtn">Enter Chat</button>
    <div id="errorMsg"></div>
  </div>

  <div id="status">Connecting to orbit...</div>

  <div class="main-chat" id="mainChat">
    <div class="chat-container" id="chat"></div>

    <div class="input-area" id="inputArea">
      <input type="text" id="messageInput" placeholder="Send a cosmic message..." autocomplete="off" />
      <button id="sendBtn">→</button>
    </div>
  </div>

  <script>
    // ────────────────────────────────────────────────
    //  The JavaScript remains almost the same as before
    //  (only UI-related class toggles added)
    // ────────────────────────────────────────────────

    const setup = document.getElementById('setup');
    const mainChat = document.getElementById('mainChat');
    const usernameInput = document.getElementById('usernameInput');
    const joinBtn = document.getElementById('joinBtn');
    const errorMsg = document.getElementById('errorMsg');
    const chat = document.getElementById('chat');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    let pubnub;
    let username;
    const channelName = 'saga-orb-chat-glossy';

    async function checkUsername(proposedName) {
      return new Promise((resolve) => {
        pubnub.hereNow(
          { channels: [channelName], includeUUIDs: true },
          (status, response) => {
            const online = response.uuids || [];
            resolve(!online.includes(proposedName));
          }
        );
      });
    }

    pubnub = new PubNub({ publishKey: 'demo', subscribeKey: 'demo' });
    pubnub.subscribe({ channels: [channelName] });

    joinBtn.onclick = async () => {
      const name = usernameInput.value.trim();
      if (!name || name.length < 2) {
        showError('Please choose a name (min 2 characters)');
        return;
      }

      status.textContent = 'Checking availability...';
      const available = await checkUsername(name);

      if (!available) {
        showError('That name is already orbiting — choose another');
        return;
      }

      username = name;

      pubnub = new PubNub({
        publishKey: 'demo',
        subscribeKey: 'demo',
        userId: username
      });

      pubnub.subscribe({ channels: [channelName] });

      pubnub.addListener({
        status: (s) => {
          if (s.category === 'PNConnectedCategory') {
            status.textContent = 'Connected to orbit';
            status.style.color = '#66ff99';
            setup.classList.add('hidden');
            mainChat.classList.add('show');
            addSystemMessage(`Welcome aboard, ${username} ✧`);
            pubnub.publish({ channel: channelName, message: { type: 'join', user: username } });
          }
        },
        message: (m) => {
          const msg = m.message;
          if (msg.type === 'join') {
            addSystemMessage(`${msg.user} has entered the orbit`);
          } else if (msg.type === 'message') {
            const isSent = msg.user === username;
            addMessage(msg.text, isSent ? 'sent' : 'received', msg.user);
          }
        }
      });

      usernameInput.value = '';
    };

    function showError(text) {
      errorMsg.textContent = text;
      errorMsg.style.display = 'block';
      setTimeout(() => errorMsg.style.display = 'none', 4000);
    }

    function addMessage(text, type, sender) {
      const div = document.createElement('div');
      div.classList.add('message', type);
      if (type === 'received') {
        const span = document.createElement('span');
        span.classList.add('sender');
        span.textContent = sender;
        div.appendChild(span);
      }
      div.appendChild(document.createTextNode(text));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.classList.add('system');
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      pubnub.publish({
        channel: channelName,
        message: { type: 'message', user: username, text }
      });
      messageInput.value = '';
      messageInput.focus();
    }

    sendBtn.onclick = sendMessage;
    messageInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    usernameInput.focus();
  </script>
</body>
</html>
